<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>杭州铁路线路规划</title>
<style>
/* ============================================================
   杭州铁路线路规划 · UI 2.0
   设计令牌（浅色）
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#f3f5f9; --card:#ffffff; --card2:#f7f8fc; --inset:#eef1f7;
  --ink:#171d2c; --ink2:#4b5874; --mute:#7a869e;
  --line:#e3e7f0; --line2:#ecEFF6; --line-strong:#c6cfe0;
  --accent:#0052d9; --accent-soft:#e8f1ff; --accent-ink:#003cab; --accent-line:#b3cdf6;
  --accent-grad:linear-gradient(135deg,#0052d9 0%,#1a73ff 60%,#36a3ff 100%);
  --g:#e83a30;  --g-text:#c92b22;  --g-tint:rgba(232,58,48,.09);
  --d:#0052d9;  --d-text:#003cab;  --d-tint:rgba(0,82,217,.09);
  --k:#00a870;  --k-text:#007d54;  --k-tint:rgba(0,168,112,.10);
  --transfer:#f08a12; --transfer-text:#b36207; --transfer-tint:rgba(240,138,18,.12);
  --warn:#d97706; --warn-text:#a35605; --warn-tint:rgba(217,119,6,.11);
  --ferry:#0a8fa0; --ferry-text:#077282; --ferry-tint:rgba(10,143,160,.11);
  --rail:#a3aec2; --rail-tie:#ccd4e2;
  --map-fill:#eef2f9; --map-stroke:#c0cce0; --map-grid:#e0e7f2; --glow:rgba(0,82,217,.25);
  --chip-ink:#fff;
  --shadow:0 6px 24px rgba(23,43,90,.06);
  --shadow-lg:0 14px 40px rgba(23,43,90,.13);
  --r:16px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ---------- 深色主题 ---------- */
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0c111c; --card:#141a28; --card2:#181f30; --inset:#101725;
    --ink:#e9edf5; --ink2:#9fabc0; --mute:#76829a;
    --line:#242e44; --line2:#202940; --line-strong:#303d58;
    --accent:#6aa6ff; --accent-soft:#152642; --accent-ink:#9cc2ff; --accent-line:#2c4a72;
    --accent-grad:linear-gradient(135deg,#4d94ff 0%,#6ab1ff 60%,#8cc8ff 100%);
    --g:#ff6b60;  --g-text:#ff8f86;  --g-tint:rgba(255,107,96,.15);
    --d:#6aa6ff;  --d-text:#8db8ff;  --d-tint:rgba(106,166,255,.15);
    --k:#35c98f;  --k-text:#5ad9a7;  --k-tint:rgba(53,201,143,.15);
    --transfer:#f9ab45; --transfer-text:#fbbe6e; --transfer-tint:rgba(249,171,69,.16);
    --warn:#f0a35c; --warn-text:#f5b979; --warn-tint:rgba(240,163,92,.14);
    --ferry:#37c0d6; --ferry-text:#5fd0e2; --ferry-tint:rgba(55,192,214,.15);
    --rail:#52627e; --rail-tie:#3a4a63;
    --map-fill:#101826; --map-stroke:#2b3a52; --map-grid:#1a2536; --glow:rgba(106,166,255,.25);
    --shadow:0 10px 30px rgba(0,0,0,.4);
    --shadow-lg:0 16px 44px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;padding:0 20px 48px;
}
body::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--g) 0 25%,var(--d) 25% 50%,var(--k) 50% 75%,var(--ferry) 75% 100%)}
.wrap{max-width:880px;margin:0 auto}

/* ---------- 动效系统 ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes routeDraw{to{stroke-dashoffset:0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 var(--transfer-tint)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes trackGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dotPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes numPop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.anim-in{animation:fadeInUp .38s cubic-bezier(.22,.8,.32,1) both}
.track{transform-origin:left center;animation:trackGrow .5s cubic-bezier(.22,.8,.32,1) both}
.node-dot{animation:dotPop .35s cubic-bezier(.22,.8,.32,1) both}
.node-dot--transfer{animation:dotPop .35s cubic-bezier(.22,.8,.32,1) both,pulseRing 2.4s ease-out .5s infinite}
.seg-path{animation:routeDraw 1.1s cubic-bezier(.4,0,.2,1) both}
#mapSvg .draw-once .from-dot,#mapSvg .draw-once .to-dot,#mapSvg .draw-once .xfer-dot,#mapSvg .draw-once .mid-dot{transform-box:fill-box;transform-origin:center;animation:dotPop .45s cubic-bezier(.22,.8,.32,1) both}
#mapSvg .draw-once .rlabel{animation:fadeInUp .5s cubic-bezier(.22,.8,.32,1) both}
.ferry-path{stroke-dasharray:13 8;animation:ferryDash 1.6s linear infinite}
@keyframes ferryDash{to{stroke-dashoffset:-21}}
.stat-v{animation:numPop .45s cubic-bezier(.22,.8,.32,1) both}
.tile b{animation:numPop .45s cubic-bezier(.22,.8,.32,1) both}
@media (prefers-reduced-motion: reduce){
  .anim-in,.track,.node-dot,.seg-path,.ferry-path,.stat-v,.tile b{animation:none}
  .seg-path,.ferry-path{stroke-dasharray:none;stroke-dashoffset:0}
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 页头 ---------- */
.page-head{display:flex;align-items:center;gap:12px;margin:20px 0 2px}
.logo{width:42px;height:42px;border-radius:12px;flex:none;background:var(--accent-grad);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px var(--glow)}
.logo svg{width:23px;height:23px}
.page-title{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1.3}
.page-sub{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{font-size:11px;color:var(--ink2);background:var(--card);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;white-space:nowrap}

/* ---------- 搜索 ---------- */
.search-box{position:relative;margin:18px 0 12px}
.s-input{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line-strong);border-radius:var(--r);padding:0 14px;height:56px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s,transform .2s}
.s-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-lg);transform:translateY(-1px)}
.s-icon{color:var(--mute);display:grid;place-items:center;flex:none}
.s-input input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--ink);font-size:16px;font-family:inherit;padding:0}
.s-input input::placeholder{color:var(--mute)}
.s-kbd{border:1px solid var(--line-strong);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--mute);white-space:nowrap}
.dropdown{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;display:none;transform-origin:top center}
.dropdown.show{display:block;animation:fadeInUp .22s cubic-bezier(.22,.8,.32,1) both}
.dd-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.dd-item:last-of-type{border-bottom:none}
.dd-item:hover,.dd-item.active{background:var(--accent-soft)}
.dd-name{font-size:15px;font-weight:600;color:var(--ink)}
.dd-prov{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.dd-tag{font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.dd-tag--special{color:var(--warn-text);background:var(--warn-tint)}
.dd-tag--alias{color:var(--d-text);background:var(--d-tint)}
.dd-tag--none{color:var(--ink2);background:var(--card2);border:1px solid var(--line)}
.dd-empty{padding:12px 16px;font-size:14px;color:var(--mute)}
.dd-foot{display:flex;gap:16px;flex-wrap:wrap;padding:9px 16px;font-size:11px;color:var(--mute);background:var(--card2);border-top:1px solid var(--line)}

/* ---------- 热门 + 最近 ---------- */
.hot-label{font-size:12px;color:var(--mute);margin:16px 0 8px}
.hot{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s,background .15s}
.chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);outline:none}
.chip.recent{color:var(--ink2);border-style:dashed}

/* ---------- 统计概览 ---------- */
.stats-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow);margin:14px 0 12px;animation:fadeInUp .38s cubic-bezier(.22,.8,.32,1) both}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px 9px;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tbar,var(--accent-soft));border-radius:0 3px 3px 0}
.tile b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.tile i{font-style:normal;font-size:11px;color:var(--mute)}
.tile.zero b{color:var(--mute)}
.dist{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line2)}
.dist-head{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:7px}
.dist-head i{font-style:normal;font-weight:500;color:var(--mute);font-size:11px}
.dist-rows{display:flex;flex-direction:column;gap:5px}
.drow{display:flex;align-items:center;gap:9px}
.drow .dl{flex:none;width:62px;font-size:11.5px;color:var(--ink2);text-align:right}
.drow .dt{flex:1;background:var(--inset);border-radius:6px;height:9px;overflow:hidden}
.drow .dt i{display:block;height:100%;border-radius:6px;min-width:6px;transition:width .35s ease}
.drow b{flex:none;width:26px;font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.stats-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line2);font-size:11.5px;color:var(--ink2)}
.stats-foot .src{margin-left:auto;color:var(--mute)}
.dist-note{display:flex;gap:8px;align-items:flex-start;margin-top:11px;padding:9px 11px;border-radius:9px;background:var(--transfer-tint);color:var(--warn-text);font-size:12.5px;border:1px dashed var(--transfer)}

/* ---------- 筛选器 ---------- */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding:5px;background:var(--inset);border-radius:11px;width:fit-content;max-width:100%}
.seg-btn{border:none;background:transparent;color:var(--ink2);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .13s}
.seg-btn:hover{color:var(--accent)}
.seg-btn[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg-btn .cnt{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-left:3px}
.seg-btn[aria-pressed="true"] .cnt{color:var(--accent)}

/* ---------- 地图 ---------- */
.map-wrap{margin:0 0 14px}
.map-box{position:relative;aspect-ratio:5/3.4;min-height:260px;max-height:460px;border-radius:12px;overflow:hidden;background:var(--map-fill);border:1px solid var(--line);box-shadow:var(--shadow)}
.map-box svg{display:block;width:100%;height:100%}
.land{fill:var(--map-fill);stroke:var(--map-stroke);stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 2px 6px rgba(0,0,0,.14))}
.cdot{cursor:pointer;transition:opacity .25s}
.cdot.dim{opacity:.28}
.cdot.focus{stroke:var(--accent);stroke-width:2.5}
.rlabel{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3.5px;pointer-events:none}
.seg-underlay{fill:none;stroke-width:10;opacity:.15;stroke-linecap:round}
.seg-path{fill:none;stroke-width:3.4;stroke-linecap:round}
.seg-path.hover{stroke-width:5.5;filter:drop-shadow(0 0 6px var(--glow))}
.t-G{stroke:var(--g)} .t-D{stroke:var(--d)} .t-K{stroke:var(--k)} .t-F{stroke:var(--ferry)}
.xfer-dot{fill:var(--card);stroke:var(--transfer);stroke-width:3}
.xfer-dot.in{fill:var(--transfer);stroke:var(--card);stroke-width:1.5}
.from-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.to-dot{fill:var(--ink);stroke:var(--card);stroke-width:2}
.mid-dot{fill:var(--card);stroke:var(--rail);stroke-width:1.6}
.ferry-path{fill:none;stroke:var(--ferry);stroke-width:2.6;stroke-dasharray:7 6;stroke-linecap:round}
.map-tip{position:absolute;z-index:30;pointer-events:none;display:none;background:var(--ink);color:var(--card);font-size:12px;line-height:1.4;padding:5px 10px;border-radius:8px;max-width:180px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.map-tip.show{display:block}
.map-tip b{font-size:13px}
.map-tip .role{opacity:.75;margin-left:4px}
.map-cap{position:absolute;top:8px;right:10px;z-index:10;font-size:10px;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;margin-top:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lg .bar{width:18px;height:3px;border-radius:2px}
.lg .dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--transfer);background:var(--card)}
.lg .sq{width:8px;height:8px;border-radius:2px;background:var(--accent)}
.lg .ring{width:8px;height:8px;border-radius:50%;border:2px solid var(--ink)}
.lg .dash{width:18px;height:0;border-top:2px dashed var(--ferry)}

/* ---------- 方案卡 ---------- */
.sec-label{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px 16px;margin:14px 0;transition:transform .22s cubic-bezier(.22,.8,.32,1),box-shadow .22s,border-color .22s}
.card:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card--special{border-left:3px solid var(--warn)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.od{font-size:19px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.od .arr{color:var(--mute);display:grid;place-items:center}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;padding-top:3px}
.badge{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;white-space:nowrap}
.badge--solid{color:var(--chip-ink)}
.badge--solid.g{background:linear-gradient(135deg,#f0554b,#e83a30)}
.badge--solid.d{background:linear-gradient(135deg,#1a73ff,#0052d9)}
.badge--solid.k{background:linear-gradient(135deg,#12c48a,#00a870)}
.badge--tf{color:var(--transfer-text);background:var(--transfer-tint)}
.badge--ok{color:var(--k-text);background:var(--k-tint)}
.badge--sp{color:var(--warn-text);background:var(--warn-tint)}
.badge--plain{color:var(--ink2);background:var(--card2);border:1px solid var(--line)}

/* 轨道示意图 */
.schem{list-style:none;margin:14px 0 4px;padding:14px 12px 12px;display:flex;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;--tag-block:34px}
.node{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:7px}
.node-dot{width:16px;height:16px;border-radius:50%;flex:none;margin-top:var(--tag-block)}
.node-dot--origin{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.node-dot--dest{background:var(--ink);box-shadow:0 0 0 4px var(--line)}
.node-dot--pass{background:var(--card);border:2px solid var(--rail)}
.node-dot--transfer{background:linear-gradient(90deg,var(--t-prev,var(--transfer)) 0 50%,var(--t-next,var(--transfer)) 50% 100%);box-shadow:0 0 0 4px var(--transfer-tint)}
.node-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.node-role{font-size:10px;padding:1px 8px;border-radius:999px;color:var(--mute);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.node-role--transfer{color:var(--transfer-text);background:var(--transfer-tint);border-color:transparent}
.node-hint{font-size:10px;color:var(--mute);white-space:nowrap}
.link{flex:1;min-width:104px;display:flex;flex-direction:column;align-items:center;gap:6px}
.line-tag{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:12px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;white-space:nowrap}
.linetype{width:20px;height:20px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.linetype.G{background:var(--g)} .linetype.D{background:var(--d)} .linetype.K{background:var(--k)} .linetype.F{background:var(--ferry)}
.track-box{height:16px;display:flex;align-items:center;width:100%}
.track{height:8px;width:100%;border-top:2px solid var(--rail-c,var(--rail));border-bottom:2px solid var(--rail-c,var(--rail));background:repeating-linear-gradient(90deg,var(--rail-tie) 0 3px,transparent 3px 15px)}
.track--g{--rail-c:var(--g)} .track--d{--rail-c:var(--d)} .track--k{--rail-c:var(--k)}
.track--ferry{--rail-c:var(--ferry);border-style:dashed;background:none}

/* 信息面板 */
.panel{border-top:1px dashed var(--line-strong);padding-top:12px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat-v{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-l{font-size:11px;color:var(--mute);margin-top:1px}
.t-g{color:var(--g-text)} .t-d{color:var(--d-text)} .t-k{color:var(--k-text)} .t-f{color:var(--ferry-text)}
.callout{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 12px;border-radius:10px;font-size:13px}
.callout svg{flex:none;margin-top:3px}
.callout--ok{background:var(--k-tint);color:var(--k-text)}
.callout--transfer{background:var(--transfer-tint);color:var(--transfer-text)}
.callout--warn{background:var(--warn-tint);color:var(--warn-text);border:1px dashed var(--warn)}
.callout b{font-weight:700}
.stops{margin-top:12px}
.stops-label{font-size:12px;color:var(--mute);margin-bottom:6px}
.stops-grid{display:flex;flex-wrap:wrap;gap:6px}
.stop{font-size:12px;padding:3px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.btn-expand{margin-top:8px;border:1px dashed var(--line-strong);background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
.btn-expand:hover{background:var(--accent-soft)}
.t-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.t-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;flex-wrap:wrap}
.t-idx{width:18px;height:18px;border-radius:50%;flex:none;background:var(--transfer-tint);color:var(--transfer-text);display:grid;place-items:center;font-size:11px;font-weight:700}
.t-row .linetype{width:16px;height:16px;font-size:9px}
.t-row .lname{font-weight:600;color:var(--ink)}
.t-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--transfer-text);padding:2px 4px}
.t-hint .i{width:13px;height:13px;flex:none}
.t-hint.k{color:var(--mute)}
.ref-route{font-size:12px;color:var(--ink2);margin-top:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-copy{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line-strong);color:var(--ink2);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-copy:hover{border-color:var(--accent);color:var(--accent)}
.btn-copy.done{color:var(--k-text);border-color:var(--k)}
.btn12306{display:inline-flex;align-items:center;gap:6px;background:var(--accent-grad);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px var(--glow);transition:transform .18s,box-shadow .18s,filter .18s}
.btn12306:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--glow);filter:brightness(1.05)}

/* ---------- 图例 / 页脚 / 省份 ---------- */
.legend{margin:22px 0 4px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.legend-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 10px}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 18px}
.lg-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.lg-track{width:26px;height:8px;flex:none;border-top:2px solid var(--rail-c,var(--rail));border-bottom:2px solid var(--rail-c,var(--rail));background:repeating-linear-gradient(90deg,var(--rail-tie) 0 2px,transparent 2px 10px)}
.lg-track--ferry{border-style:dashed;background:none}
.lg-dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--transfer);background:var(--card);position:relative;overflow:hidden}
.lg-dot::after{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--g)}
.lg-dot::before{content:"";position:absolute;right:0;top:0;bottom:0;width:50%;background:var(--d)}
.allcities{margin:16px 0 0}
.allcities summary{cursor:pointer;font-size:13px;color:var(--accent);user-select:none}
.prov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin-top:10px}
.prov-grid .p{font-size:13px}
.prov-grid .p b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.prov-grid .p span{color:var(--mute);font-size:12px;line-height:1.8}
.footer{margin:26px 0 8px;color:var(--mute);font-size:12px;text-align:center;line-height:1.9}
.footer b{color:var(--ink2);font-weight:600}
.empty-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--mute);font-size:14px;margin:14px 0}

/* ---------- 响应式 ---------- */
@media (max-width:840px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  body{padding:0 16px 40px}
  .page-title{font-size:20px}
  .meta{margin-left:0}
  .card{padding:14px 14px 14px}
  .schem{flex-direction:column;align-items:stretch;padding:12px 12px 10px}
  .node{flex-direction:row;width:100%;align-items:center;gap:10px;min-height:38px}
  .node-dot{margin-top:0}
  .node-role{margin-left:auto}
  .link{flex-direction:row;align-items:flex-start;gap:12px;width:100%;min-width:0;padding:2px 0}
  .link .track-box{order:1;width:8px;height:52px;flex:none;margin-left:4px}
  .link .line-tag{order:2;margin-top:12px}
  .track{height:100%;width:8px;border:none;border-left:2px solid var(--rail-c,var(--rail));border-right:2px solid var(--rail-c,var(--rail));background:repeating-linear-gradient(180deg,var(--rail-tie) 0 3px,transparent 3px 15px);transform-origin:top center}
  .track--ferry{border-style:dashed;background:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions .btn12306{flex:1;justify-content:center}
  .dd-prov{display:none}
  .map-box{aspect-ratio:5/4}
}

/* ---------- 深色组件覆盖 ---------- */
@media (prefers-color-scheme: dark){
  .badge--solid.g{background:var(--g-tint);color:var(--g-text)}
  .badge--solid.d{background:var(--d-tint);color:var(--d-text)}
  .badge--solid.k{background:var(--k-tint);color:var(--k-text)}
  .linetype{background:var(--card);color:var(--ink)}
  .linetype.G{background:var(--g-tint);color:var(--g-text)}
  .linetype.D{background:var(--d-tint);color:var(--d-text)}
  .linetype.K{background:var(--k-tint);color:var(--k-text)}
  .linetype.F{background:var(--ferry-tint);color:var(--ferry-text)}
}
</style>
</head>

<script>
(function(){
  var LINES = JSON.parse(document.getElementById('rail-lines').textContent);
  var SPECIAL = JSON.parse(document.getElementById('rail-special').textContent);
  var ALIAS = JSON.parse(document.getElementById('rail-alias').textContent);
  var DIRECT = JSON.parse(document.getElementById('rail-direct').textContent);
  var PROVINCE = JSON.parse(document.getElementById('rail-province').textContent);
  var CITYPOS = JSON.parse(document.getElementById('rail-citypos').textContent);

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var lineByName = {};
  var linesFromCity = {};
  LINES.forEach(function(L){
    lineByName[L.name] = L;
    L.stops.forEach(function(c){
      (linesFromCity[c] = linesFromCity[c] || []).push({name:L.name, type:L.type});
    });
  });

  // 杭州跨线贯通直达城市 → 0 换乘虚拟线
  Object.keys(DIRECT).forEach(function(city){
    var d = DIRECT[city];
    var vname = '贯通:' + city;
    lineByName[vname] = {name:vname, type:d.t, stops:['杭州', city]};
    (linesFromCity['杭州'] = linesFromCity['杭州'] || []).push({name:vname, type:d.t});
    (linesFromCity[city] = linesFromCity[city] || []).push({name:vname, type:d.t});
  });

  var allCities = Object.keys(linesFromCity).concat(Object.keys(SPECIAL));
  var HOT = ['北京','上海','广州','深圳','成都','重庆','西安','武汉','昆明','乌鲁木齐','拉萨','海口','三亚','澳门','香港','台北'];
  var RECENT_KEY = 'rail-recent-v1';

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var q = $('q'), dd = $('dropdown'), result = $('result'), hotEl = $('hot');

  $('pillLines').textContent = '路网 ' + LINES.length + ' 条线路';
  $('pillCities').textContent = allCities.length + ' 城可查';

  var state = { kind:null, city:null, routes:[], filter:'all', direct:null, special:null, mapShown:false, hoverIdx:-1 };

  /* ================= 工具函数 ================= */
  function normalize(s){ return (s||'').replace(/\s+/g,''); }
  function resolveCity(raw){
    var s = normalize(raw);
    if(!s) return null;
    if(ALIAS[s]) s = ALIAS[s];
    if(allCities.indexOf(s) >= 0) return s;
    var t = s.replace(/(市|地区|自治州|特别行政区|自治区|盟)$/,'');
    if(ALIAS[t]) t = ALIAS[t];
    if(allCities.indexOf(t) >= 0) return t;
    var hit = allCities.filter(function(c){ return c.indexOf(s) >= 0 || s.indexOf(c) >= 0; });
    return hit.length ? hit[0] : null;
  }
  function getRecent(){
    try{ return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }catch(e){ return []; }
  }
  function pushRecent(city){
    var r = getRecent().filter(function(x){ return x !== city; });
    r.unshift(city); r = r.slice(0,6);
    try{ localStorage.setItem(RECENT_KEY, JSON.stringify(r)); }catch(e){}
    renderChips();
  }

  /* ================= 搜索与下拉 ================= */
  function renderChips(){
    hotEl.innerHTML = '';
    var recent = getRecent();
    recent.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip recent'; b.textContent = c;
      b.addEventListener('click', function(){ doSearch(c); });
      hotEl.appendChild(b);
    });
    HOT.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = c;
      b.addEventListener('click', function(){ doSearch(c); });
      hotEl.appendChild(b);
    });
  }
  var ddActive = 0;
  function ddList(){
    var s = normalize(q.value);
    if(!s) return [];
    return allCities.filter(function(c){ return c.indexOf(s) >= 0; }).slice(0, 50);
  }
  function renderDD(list){
    dd.innerHTML = '';
    if(!list.length){
      dd.innerHTML = '<div class="dd-empty">未找到匹配城市，换个写法试试（支持别名：乌市 / 格尔木 / 香格里拉…）</div>';
      dd.classList.add('show'); return;
    }
    ddActive = Math.min(ddActive, list.length - 1);
    list.forEach(function(c, i){
      var d = document.createElement('div');
      d.className = 'dd-item' + (i === ddActive ? ' active' : '');
      d.setAttribute('role','option');
      var prov = PROVINCE[c] || '';
      var tag = '';
      if(SPECIAL[c]) tag = '<span class="dd-tag dd-tag--special">特殊 · 需转乘</span>';
      else if(ALIAS[c]) tag = '<span class="dd-tag dd-tag--alias">别名：' + esc(ALIAS[c]) + '</span>';
      else if(!linesFromCity[c]) tag = '<span class="dd-tag dd-tag--none">无铁路 · 转公路</span>';
      d.innerHTML = '<span class="dd-name">' + esc(c) + '</span>' + tag + '<span class="dd-prov">' + esc(prov) + '</span>';
      d.addEventListener('mousedown', function(e){ e.preventDefault(); doSearch(c); });
      d.addEventListener('mousemove', function(){ if(ddActive !== i){ ddActive = i; markDD(); } });
      dd.appendChild(d);
    });
    dd.classList.add('show');
  }
  function markDD(){
    var items = dd.querySelectorAll('.dd-item');
    for(var i=0;i<items.length;i++) items[i].classList.toggle('active', i === ddActive);
  }
  function closeDD(){ dd.classList.remove('show'); }
  q.addEventListener('input', function(){
    var list = ddList();
    ddActive = 0;
    if(list.length) renderDD(list); else closeDD();
  });
  q.addEventListener('focus', function(){
    var list = ddList();
    if(list.length){ ddActive = 0; renderDD(list); }
  });
  q.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeDD(); return; }
    if(e.key === 'Enter'){
      e.preventDefault();
      var list = ddList();
      if(list.length){ doSearch(list[ddActive]); closeDD(); }
      else if(q.value.trim()){ doSearch(q.value.trim()); closeDD(); }
      return;
    }
    if(!dd.classList.contains('show')) return;
    var list = ddList();
    if(e.key === 'ArrowDown'){ e.preventDefault(); ddActive = (ddActive + 1) % list.length; markDD(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); ddActive = (ddActive - 1 + list.length) % list.length; markDD(); }
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.search-box')) closeDD();
  });

  /* ================= 核心算法：线路层 BFS ================= */
  function findRoutes(from, to){
    var fromLines = linesFromCity[from] || [];
    var toLines = linesFromCity[to] || [];
    if(!fromLines.length || !toLines.length) return null;

    var routes = [];
    fromLines.filter(function(f){
      return toLines.some(function(t){ return t.name === f.name; });
    }).forEach(function(d){
      routes.push({ transfers:0, segs:[{line:d.name, type:d.type, from:from, to:to}], vias:[] });
    });

    // visited 记录每条线路的最少换乘数；允许“比最少多 1 次”的次优路径入队，
    // 以保留真实存在的绕行备选（如经另一枢纽换乘），同时剪掉绕圈的垃圾路径。
    var visited = {};
    fromLines.forEach(function(f){ visited[f.name] = 0; });
    var queue = fromLines.map(function(f){ return {name:f.name, transfers:0, parent:null, via:null}; });
    var head = 0;
    while(head < queue.length){
      var cur = queue[head++];
      if(cur.transfers >= 3) continue;
      var line = lineByName[cur.name];
      for(var i=0;i<line.stops.length;i++){
        var city = line.stops[i];
        var nls = linesFromCity[city] || [];
        for(var j=0;j<nls.length;j++){
          var nl = nls[j];
          var nt = cur.transfers + 1;
          if(visited[nl.name] !== undefined && nt > visited[nl.name] + 1) continue;
          visited[nl.name] = (visited[nl.name] === undefined) ? nt : Math.min(visited[nl.name], nt);
          queue.push({name:nl.name, transfers:nt, parent:cur, via:city});
        }
      }
    }

    var toLineNames = toLines.map(function(t){ return t.name; });
    queue.filter(function(n){ return toLineNames.indexOf(n.name) >= 0 && n.transfers > 0; }).forEach(function(r){
      // 沿 parent 链回溯出完整线路序列与换乘城市
      var chain = [], viaChain = [], node = r;
      while(node){
        chain.unshift(node.name);
        if(node.via) viaChain.unshift(node.via);
        node = node.parent;
      }
      var segs = [], vias = [];
      var prevCity = from;
      for(var k=0;k<chain.length;k++){
        var endCity = (k < chain.length-1) ? viaChain[k] : to;
        var L = lineByName[chain[k]];
        segs.push({line:chain[k], type:L.type, from:prevCity, to:endCity});
        prevCity = endCity;
        if(k < chain.length-1) vias.push(endCity);

    routes.sort(function(a,b){

      var sb = Math.max.apply(null, b.segs.map(function(s){ return rank[s.type]; }));

    });

    var out = [];
    routes.forEach(function(r){
      var key = r.segs.map(function(s){ return s.line; }).join('>');
      if(!seen[key]){ seen[key] = 1; out.push(r); }
    });

        '<p class="ref-route">此为宏观走线，具体车次是否停靠、每日班次，以 12306 实时查询为准。</p>' +
        '<div class="actions">' +
          '<button type="button" class="btn-copy" data-text="' + esc('杭州 → ' + state.city + '｜直达（' + dr.r + '），无需下车换乘') + '"><span>复制路线</span></button>' +
          '<button type="button" class="btn12306">去 12306 查实时班次 →</button>' +
        '</div>' +
      '</div>';
    card.querySelector('.btn12306').addEventListener('click', function(){ window.open('https://kyfw.12306.cn/otn/leftTicket/init','_blank'); });
    card.querySelector('.btn-copy').addEventListener('click', function(){ copyText(this.getAttribute('data-text'), this); });
    result.appendChild(card);
  }

  function renderSpecialCard(){
    var sp = state.special;
    var card = document.createElement('section');
    card.className = 'card card--special anim-in';
    card.innerHTML =
      '<div class="card-head">' +
        '<div class="od"><span>杭州</span><span class="arr">→</span><span>' + esc(state.city) + '</span></div>' +
        '<div class="card-badges"><span class="badge badge--sp">特殊目的地</span></div>' +
      '</div>' +
      '<div class="callout callout--warn">⚠ <span>' + esc(sp.note) + '</span></div>' +
      '<div class="panel"><p class="ref-route">参考路线：<b>' + esc(sp.suggest) + '</b></p>' +
        '<div class="actions">' +
          '<button type="button" class="btn-copy" data-text="' + esc(sp.suggest) + '"><span>复制路线</span></button>' +
          '<button type="button" class="btn12306">去 12306 查实时班次 →</button>' +
        '</div>' +
      '</div>';
    card.querySelector('.btn12306').addEventListener('click', function(){ window.open('https://kyfw.12306.cn/otn/leftTicket/init','_blank'); });
    card.querySelector('.btn-copy').addEventListener('click', function(){ copyText(this.getAttribute('data-text'), this); });
    result.appendChild(card);
  }

  function renderCards(){
    var rs = filterRoutes();
    if(!rs.length){
      result.appendChild((function(){
        var d = document.createElement('div');
        d.className = 'empty-box';
        d.textContent = '当前筛选条件下无方案，试试其他筛选。';
        return d;
      })());
      return;
    }
    var sec = document.createElement('p');
    sec.className = 'sec-label';
    sec.textContent = '可行方案 · 按推荐排序';
    result.appendChild(sec);

    rs.forEach(function(r, idx){
      var card = document.createElement('section');
      card.className = 'card anim-in';
      card.style.animationDelay = (idx * 60) + 'ms';
      card.setAttribute('data-idx', idx);

      var headLabel;
      if(r.transfers === 0) headLabel = '全程无需换乘';
      else headLabel = '在 ' + r.vias.join('、') + ' 换乘';
      var allTypes = r.segs.map(function(s){ return s.type; });
      var typeBadge = '';
      if(allTypes.indexOf('K') < 0 && allTypes.indexOf('D') < 0) typeBadge = '<span class="badge badge--plain">全程 G 字头</span>';
      else if(allTypes.indexOf('K') < 0) typeBadge = '<span class="badge badge--plain">全程高速</span>';
      else typeBadge = '<span class="badge badge--plain">含普速段</span>';

      var head = document.createElement('div');
      head.className = 'card-head';
      head.innerHTML =
        '<div class="od"><span>杭州</span><span class="arr">→</span><span>' + esc(state.city) + '</span></div>' +
        '<div class="card-badges">' +
          (r.transfers === 0
            ? '<span class="badge badge--solid ' + r.segs[0].type.toLowerCase() + '">' + r.segs[0].type + ' 直达</span>'
            : '<span class="badge badge--tf">' + r.transfers + ' 次中转</span>') +
          typeBadge +
        '</div>';

      // 轨道示意图
      var schem = document.createElement('ul');
      schem.className = 'schem';
      schem.setAttribute('role','list');
      var parts = [];
      r.segs.forEach(function(seg, si){
        if(si === 0){
          parts.push('<li class="node"><span class="node-dot node-dot--origin"></span><span class="node-name">杭州</span><span class="node-role">出发</span></li>');
        }
        var lt = seg.line.indexOf('轮渡') >= 0 ? 'F' : seg.type;
        var lc = lt === 'F' ? 'ferry' : lt.toLowerCase();
        parts.push(
          '<li class="link"><span class="line-tag"><span class="linetype ' + lt + '">' + lt + '</span><span class="lname">' + esc(lineLabel(seg)) + '</span></span>' +
          '<span class="track-box"><span class="track track--' + lc + '"></span></span></li>'
        );
        if(si < r.segs.length-1){
          var prevT = seg.line.indexOf('轮渡') >= 0 ? 'F' : seg.type;
          var nextSeg = r.segs[si+1];
          var nextT = nextSeg.line.indexOf('轮渡') >= 0 ? 'F' : nextSeg.type;
          parts.push(
            '<li class="node"><span class="node-dot node-dot--transfer" style="--t-prev:var(--' + prevT.toLowerCase() + ');--t-next:var(--' + nextT.toLowerCase() + ')"></span>' +
            '<span class="node-name">' + esc(seg.to) + '</span><span class="node-role node-role--transfer">换乘</span><span class="node-hint">' + (nextT === 'K' ? '班次少 · 预留充足时间' : '建议预留 30 分钟') + '</span></li>'
          );
        } else {
          parts.push('<li class="node"><span class="node-dot node-dot--dest"></span><span class="node-name">' + esc(seg.to) + '</span><span class="node-role">到达</span></li>');
        }
      });
      schem.innerHTML = parts.join('');

      // 信息面板
      var panel = document.createElement('div');
      panel.className = 'panel';
      var segCount = r.segs.length;
      var ferryCount = r.segs.filter(function(s){ return s.line.indexOf('轮渡') >= 0; }).length;
      var panelHtml =
        '<div class="stats">' +
          '<div class="stat"><div class="stat-v">' + r.transfers + ' 次</div><div class="stat-l">换乘次数</div></div>' +
          '<div class="stat"><div class="stat-v">' + allTypes.filter(function(t,i,a){ return a.indexOf(t)===i; }).map(function(t){ return '<span class="t-' + t.toLowerCase() + '">' + t + '</span>'; }).join(' ') + '</div><div class="stat-l">车次类型</div></div>' +
          '<div class="stat"><div class="stat-v">' + segCount + ' 段</div><div class="stat-l">行程分段</div></div>' +
          '<div class="stat"><div class="stat-v">' + (ferryCount ? ferryCount + ' 段' : '无') + '</div><div class="stat-l">跨海轮渡</div></div>' +
        '</div>';
      if(r.transfers > 0){
        var hasK = allTypes.indexOf('K') >= 0;
        panelHtml += '<div class="callout callout--transfer">⏱ <span><b>换乘提示</b> — 每次换乘建议预留 30 分钟以上' + (hasK ? '；普速（K 字头）班次少，建议预留充足时间并提前购票' : '') + '</span></div>';
      } else {
        panelHtml += '<div class="callout callout--ok">✓ <span><b>直达</b> — 沿 ' + esc(lineLabel(r.segs[0])) + ' 直达' + esc(state.city) + '，无需下车换乘</span></div>';
      }
      // 停靠站（超过 12 站折叠，可展开）
      var allMid = [];
      r.segs.forEach(function(seg){ allMid = allMid.concat(midStopsOf(seg)); });
      if(allMid.length){
        var folded = allMid.length > 12;
        var visible = folded ? allMid.slice(0, 12) : allMid;
        panelHtml += '<div class="stops"><div class="stops-label">沿线主要停靠（' + allMid.length + ' 站）</div><div class="stops-grid">' +
          visible.map(function(c){ return '<span class="stop">' + esc(c) + '</span>'; }).join('') + '</div>';
        if(folded){
          panelHtml += '<button type="button" class="btn-expand" data-n="' + allMid.length + '" data-hidden="' + esc(allMid.slice(12).join('|')) + '">展开全部 ' + allMid.length + ' 站 ▾</button></div>';
        } else {
          panelHtml += '</div>';
        }
      }
      // 换乘明细
      panelHtml += '<div class="t-list">' + r.segs.map(function(seg, si){
        var lt = seg.line.indexOf('轮渡') >= 0 ? 'F' : seg.type;
        return '<div class="t-row"><span class="t-idx">' + (si+1) + '</span><span class="linetype ' + lt + '">' + lt + '</span><span class="lname">' + esc(lineLabel(seg)) + '</span><span>' + esc(seg.from) + ' → ' + esc(seg.to) + '</span></div>';
      }).join('') + '</div>';
      panelHtml += '<p class="ref-route">宏观走线参考，具体车次/时刻以 12306 实时查询为准。</p>';
      panelHtml += '<div class="actions">' +
        '<button type="button" class="btn-copy" data-text="' + esc(routeText(r, state.city)) + '"><span>复制路线</span></button>' +
        '<button type="button" class="btn12306">去 12306 查实时班次 →</button>' +
      '</div>';
      panel.innerHTML = panelHtml;

      card.appendChild(head);
      card.appendChild(schem);
      card.appendChild(panel);
      card.querySelector('.btn12306').addEventListener('click', function(){ window.open('https://kyfw.12306.cn/otn/leftTicket/init','_blank'); });
      card.querySelector('.btn-copy').addEventListener('click', function(){ copyText(this.getAttribute('data-text'), this); });
      var expandBtn = card.querySelector('.btn-expand');
      if(expandBtn){
        expandBtn.addEventListener('click', function(){
          var hidden = expandBtn.getAttribute('data-hidden').split('|');
          hidden.forEach(function(c){
            var s = document.createElement('span');
            s.className = 'stop';
            s.textContent = c;
            expandBtn.parentNode.querySelector('.stops-grid').appendChild(s);
          });
          expandBtn.remove();
        });
      }

      // 地图联动
      if(mapWrap){
        card.addEventListener('mouseenter', function(){
          state.mapRouteIdx = idx;
          drawMapRoute(r, true);
        });
        card.addEventListener('mouseleave', function(){
          if(state.mapRouteIdx === idx){
            state.mapRouteIdx = 0;
            drawMapRoute(defaultMapRoute(), false);
          }
        });
      }
      result.appendChild(card);
    });
  }

  /* ================= 省份浏览 ================= */
  var provGrid = $('provGrid');
  var byProv = {};
  allCities.forEach(function(c){
    var p = PROVINCE[c] || '其他';
    (byProv[p] = byProv[p] || []).push(c);
  });
  Object.keys(byProv).sort(function(a,b){
    return (a==='其他'?1:0)-(b==='其他'?1:0) || a.localeCompare(b,'zh');
  }).forEach(function(p){
    var box = document.createElement('div');
    box.className = 'p';
    box.innerHTML = '<b>' + p + '</b><span>' + byProv[p].sort(function(a,b){return a.localeCompare(b,'zh');}).join('、') + '</span>';
    provGrid.appendChild(box);
  });

  renderChips();
})();
</script>
</body>
</html>
